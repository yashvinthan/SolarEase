# ==============================================================================
# Google Cloud Build Pipeline for SolarEase Backend
# Runs tests, builds container image, applies migrations, and deploys to Cloud Run
# ==============================================================================

steps:
  # 1. Run backend unit and integration tests against clean isolated environment
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt pytest httpx
        DATABASE_URL="sqlite:///:memory:" python -m pytest tests/
    id: 'run-backend-tests'

  # 2. Build container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'
      - '.'
    id: 'build-image'

  # 3. Push container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
    id: 'push-image'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'
    id: 'push-latest'

  # 4. Deploy to Google Cloud Run (only executed if tests pass)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300s'
      - '--concurrency'
      - '80'
    id: 'deploy-cloud-run'

images:
  - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_AR_HOSTNAME/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'

substitutions:
  _AR_HOSTNAME: 'asia-south1-docker.pkg.dev'
  _REPO_NAME: 'solarease-backend'
  _SERVICE_NAME: 'solarease-backend'
  _DEPLOY_REGION: 'asia-south1'

options:
  logging: CLOUD_LOGGING_ONLY
