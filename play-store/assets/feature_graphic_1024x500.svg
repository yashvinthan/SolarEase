<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261B"/>
      <stop offset="40%" stop-color="#1A3826"/>
      <stop offset="100%" stop-color="#245B3A"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="100%" stop-color="#F5E8C4"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="500" fill="url(#bannerBg)"/>

  <!-- Technical Grid Overlay (Solar Utility Style) -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="880" y1="0" x2="880" y2="500"/>
    <line x1="960" y1="0" x2="960" y2="500"/>
    <line x1="0" y1="100" x2="1024" y2="100"/>
    <line x1="0" y1="200" x2="1024" y2="200"/>
    <line x1="0" y1="300" x2="1024" y2="300"/>
    <line x1="0" y1="400" x2="1024" y2="400"/>
  </g>

  <!-- Left: Brand & Typography Block -->
  <g transform="translate(80, 110)">
    <!-- Category Badge -->
    <rect width="168" height="32" rx="16" fill="#EEF2E9" fill-opacity="0.15" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <text x="18" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#E2E8DD" letter-spacing="1">INDIAN HOME ENERGY</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">SolarEase</text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#D2DBD1">TNEB Bill Calculator &amp; Rooftop Solar Field Guide</text>

    <!-- Feature Checklist -->
    <g transform="translate(0, 160)" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8DD">
      <!-- Bullet 1 -->
      <circle cx="8" cy="8" r="6" fill="#4ADE80"/>
      <path d="M 5 8 L 7.5 10.5 L 11 5.5" stroke="#17201B" stroke-width="1.5" fill="none"/>
      <text x="24" y="12" font-weight="500">Camera OCR Meter Scanner (100% Offline)</text>

      <!-- Bullet 2 -->
      <circle cx="8" cy="38" r="6" fill="#4ADE80"/>
      <path d="M 5 38 L 7.5 40.5 L 11 35.5" stroke="#17201B" stroke-width="1.5" fill="none"/>
      <text x="24" y="42" font-weight="500">PM Surya Ghar Subsidy up to ₹78,000</text>

      <!-- Bullet 3 -->
      <circle cx="8" cy="68" r="6" fill="#4ADE80"/>
      <path d="M 5 68 L 7.5 70.5 L 11 65.5" stroke="#17201B" stroke-width="1.5" fill="none"/>
      <text x="24" y="72" font-weight="500">Verified Local EPC Solar Installers</text>
    </g>
  </g>

  <!-- Right: Decorative Technical Solar UI Device Mock -->
  <g transform="translate(680, 60)">
    <!-- Device Frame -->
    <rect width="260" height="380" rx="36" fill="#17201B" stroke="#D2DBD1" stroke-width="2"/>
    <rect width="244" height="364" x="8" y="8" rx="28" fill="#F8F8F2"/>

    <!-- Screen Header -->
    <rect width="244" height="70" x="8" y="8" rx="28" fill="#EEF2E9"/>
    <rect width="244" height="1" x="8" y="78" fill="#D2DBD1"/>
    <text x="32" y="45" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17201B">TNEB Domestic Bill</text>
    <text x="32" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A52">Tariff 1A • 60-Day Cycle</text>

    <!-- Metric Card -->
    <g transform="translate(24, 96)">
      <rect width="212" height="84" rx="12" fill="#FFFFFF" stroke="#D2DBD1" stroke-width="1"/>
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A52">CURRENT ESTIMATE</text>
      <text x="16" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#17201B">₹ 3,420</text>
      <rect x="135" y="16" width="65" height="22" rx="6" fill="#FDF6E2" stroke="#E5D5A5" stroke-width="1"/>
      <text x="142" y="31" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#B45309">Slab Tier 3</text>
    </g>

    <!-- Solar Recommendation Card -->
    <g transform="translate(24, 196)">
      <rect width="212" height="106" rx="12" fill="#EBF3ED" stroke="#245B3A" stroke-width="1.5"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#245B3A">SOLAR RECOMMENDATION</text>
      <text x="16" y="52" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#17201B">3.0 kW System</text>
      <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#4F5A52">Subsidy: ₹78,000 Govt. DBT</text>
      <rect x="16" y="80" width="180" height="18" rx="4" fill="#245B3A"/>
      <text x="50" y="93" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Save ₹20,520 / yr</text>
    </g>
  </g>
</svg>

