version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    container_name: solarease-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: solarease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarease}
      POSTGRES_USER: ${POSTGRES_USER:-solarease_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solarease_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solarease-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-solarease_redis_pass}" --appendonly yes
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: solarease-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-solarease_minio_pass}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: solarease-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solarease-backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      PROJECT_NAME: "SolarEase Backend"
      ENVIRONMENT: "production"
      DEBUG: "False"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-solarease_admin}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-solarease}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-solarease_redis_pass}@redis:6379/0"
      MINIO_ENDPOINT: "http://minio:9000"
      QDRANT_URL: "http://qdrant:6333"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-firebase-adminsdk.json}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  caddy_data:
  caddy_config:
